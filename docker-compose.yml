name: dwellio

services:
  # ============================================================================
  # 1. MongoDB Database Service
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: dwellio-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - dwellio-network
    # Exposes 27017 on localhost only for optional developer tooling (Compass, mongosh).
    # To disable host exposure in hardened environments, remove or comment out this port mapping.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. Redis In-Memory Cache & BullMQ Message Broker (Phase 5)
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: dwellio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-dwellio_redis_dev_secret}"]
    volumes:
      - redis_data:/data
    networks:
      - dwellio-network
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dwellio_redis_dev_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 3. Dwellio Backend API Service (Express + TypeScript + Node.js)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: dwellio-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - MONGO_URI=mongodb://mongodb:27017/dwellio
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dwellio_redis_dev_secret}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dwellio_redis_dev_secret}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - API_RATE_LIMIT_MAX=500
      - CATALOG_RATE_LIMIT_MAX=200
      - NOTIFICATION_RATE_LIMIT_MAX=150
      - BOOKING_RATE_LIMIT_MAX=15
      - MONGODB_MAX_POOL_SIZE=50
      - MONGODB_MIN_POOL_SIZE=2
    ports:
      - "5000:5000"
    networks:
      - dwellio-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # 4. Dwellio Background Worker Service (BullMQ Supervisor - Phase 5)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: dwellio-worker
    restart: unless-stopped
    command: ["node", "apps/backend/dist/worker.js"]
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/dwellio
      - REDIS_URL=redis://:${REDIS_PASSWORD:-dwellio_redis_dev_secret}@redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dwellio_redis_dev_secret}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
    networks:
      - dwellio-network

  # ============================================================================
  # 5. Dwellio Frontend Service (React + Vite + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: dwellio-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - dwellio-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  mongodb_data:
    name: dwellio_mongodb_data
  redis_data:
    name: dwellio_redis_data

# ==============================================================================
# Internal Bridge Network
# ==============================================================================
networks:
  dwellio-network:
    name: dwellio-network
    driver: bridge
