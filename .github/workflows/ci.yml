name: Dwellio CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Build, Validate & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Typecheck monorepo
        run: npm run typecheck

      - name: Build all packages & applications
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Run unit & integration test suites
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/dwellio_ci_test
          JWT_SECRET: dwellio_ci_test_jwt_secret_key_minimum_32_bytes_long
        run: npm test

      - name: Run end-to-end deployment smoke tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/dwellio_ci_e2e_test
          JWT_SECRET: dwellio_ci_test_jwt_secret_key_minimum_32_bytes_long
        run: npm run test:e2e:smoke
