<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dwellio – pick a room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#FAF6EE;--surface:#FFFDF8;--ink:#0F3D3E;--muted:#5d7774;--line:#c9d6d1;--accent:#D9653B;--ok:#2E9E6B;--warn:#E8A33D;--room:#eef3ee;--roomHi:#fde9dd;--shadow:0 1px 0 #e5dccb,0 8px 18px -10px rgba(15,61,62,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1b1c;--surface:#10292a;--ink:#f1ece0;--muted:#9bb3ae;--line:#2c4a4a;--room:#12302f;--roomHi:#3a2a22;--shadow:0 1px 0 #000,0 8px 18px -10px #000}}
:root[data-theme="dark"]{--bg:#0a1b1c;--surface:#10292a;--ink:#f1ece0;--muted:#9bb3ae;--line:#2c4a4a;--room:#12302f;--roomHi:#3a2a22;--shadow:0 1px 0 #000,0 8px 18px -10px #000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.1}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;max-width:1120px;margin:auto}
.logo{font:700 24px Fraunces,Georgia,serif}
.logo i{display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-left:3px}
.tools{display:flex;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
main{max-width:1120px;margin:auto;padding:8px 24px 48px;display:grid;grid-template-columns:1.05fr 1fr;gap:32px;align-items:start}
.intro h1{font-size:clamp(34px,5vw,52px);font-weight:700;letter-spacing:-.01em}
.intro p{color:var(--muted);max-width:44ch;margin:14px 0 18px}
svg.house{width:100%;height:auto;display:block}
.room{cursor:pointer;outline:none}
.room .fill{fill:var(--room);stroke:var(--ink);stroke-width:1.5;transition:fill .2s}
.room:hover .fill,.room:focus-visible .fill{fill:var(--roomHi)}
.room.on .fill{fill:var(--roomHi);stroke:var(--accent);stroke-width:3}
.room:focus-visible .fill{stroke:var(--accent);stroke-dasharray:6 4}
.room .art{fill:none;stroke:var(--ink);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.room text{font:600 13px "Plus Jakarta Sans",sans-serif;fill:var(--ink)}
.glow{opacity:0;transition:opacity .25s;fill:#f6c453}
.room:hover .glow,.room.on .glow{opacity:.55}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.panel{background:var(--surface);border-radius:16px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line);position:sticky;top:12px}
.panel h2{font-size:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px}
.pro{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.pro b{display:block}.pro small{color:var(--muted)}
.ring{width:52px;height:52px}
.ring circle{fill:none;stroke-width:5;transform:rotate(-90deg);transform-origin:50% 50%;stroke-linecap:round}
.ring .off{stroke:var(--line)}
.ring .seg{stroke:var(--ok);animation:fill .5s both}
@keyframes fill{from{opacity:0}to{opacity:1}}
.book{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600}
.book:focus-visible,.ghost:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tag{font-size:13px;color:var(--ok);font-weight:600}
.track{margin-top:18px;border-top:1px dashed var(--line);padding-top:16px}
.track h3{font-size:18px;margin-bottom:12px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:15px}
.steps li span.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;transition:all .25s}
.steps li.done{color:var(--ink)}
.steps li.done .dot{background:var(--ok);border-color:var(--ok)}
.steps li.now .dot{border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 5px rgba(217,101,59,.25)}
.steps li.now{color:var(--ink);font-weight:600}
.steps time{margin-left:auto;font-size:13px}
@media (max-width:820px){main{grid-template-columns:1fr}.panel{position:static}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">Dwellio<i></i></div>
  <div class="tools"><button class="ghost" id="theme" aria-label="Toggle dark mode">Dark mode</button></div>
</header>
<main>
  <section class="intro">
    <h1>Pick a room. See who’s verified to fix it.</h1>
    <p>Every professional on Dwellio is checked by our admin team before they can take a job. Tap a part of the house to see them.</p>
    <svg class="house" viewBox="0 0 400 380" role="group" aria-label="Cutaway of a house. Choose a room.">
      <g class="room" data-room="roof" tabindex="0" role="button" aria-label="Roof">
        <polygon class="fill" points="24,112 200,20 376,112"/>
        <polygon class="glow" points="60,108 200,36 340,108"/>
        <path class="art" d="M120 94l80-40 80 40M150 94l50-26 50 26"/>
        <text x="200" y="100" text-anchor="middle">Roof</text>
      </g>
      <g class="room" data-room="bath" tabindex="0" role="button" aria-label="Bathroom">
        <rect class="fill" x="24" y="112" width="176" height="130"/>
        <rect class="glow" x="30" y="118" width="164" height="118"/>
        <path class="art" d="M50 200h60v-18H50zM58 200v8M102 200v8M130 150v40M130 150h14M150 168h30v22h-30z"/>
        <text x="36" y="136">Bathroom</text>
      </g>
      <g class="room" data-room="living" tabindex="0" role="button" aria-label="Living room">
        <rect class="fill" x="200" y="112" width="176" height="130"/>
        <rect class="glow" x="206" y="118" width="164" height="118"/>
        <path class="art" d="M225 205h80v-22a8 8 0 0 0-8-8h-64a8 8 0 0 0-8 8zM232 205v8M298 205v8M330 150h28v28h-28zM344 150v28"/>
        <text x="212" y="136">Living room</text>
      </g>
      <g class="room" data-room="kitchen" tabindex="0" role="button" aria-label="Kitchen">
        <rect class="fill" x="24" y="242" width="176" height="124"/>
        <rect class="glow" x="30" y="248" width="164" height="112"/>
        <path class="art" d="M48 340h110v-44H48zM48 318h110M70 296v-14M102 296v-14M134 296v-14M60 275h22M92 275h22M124 275h22"/>
        <text x="36" y="266">Kitchen</text>
      </g>
      <g class="room" data-room="garden" tabindex="0" role="button" aria-label="Garden and exterior">
        <rect class="fill" x="200" y="242" width="176" height="124"/>
        <rect class="glow" x="206" y="248" width="164" height="112"/>
        <path class="art" d="M230 340v-34M230 322c-14-4-18-16-18-24 12 2 18 10 18 24M230 316c12-4 16-14 16-22-10 2-16 8-16 22M300 340v-40M280 340h40M290 300c0-18 20-18 20 0"/>
        <text x="212" y="266">Garden &amp; outside</text>
      </g>
    </svg>
    <p class="hint">Tip: use Tab and Enter to move between rooms.</p>
  </section>

  <aside class="panel" aria-live="polite">
    <h2 id="title"></h2>
    <div class="chips" id="chips"></div>
    <div id="pros"></div>
    <div class="track" id="track" hidden>
      <h3 id="trackTitle"></h3>
      <ol class="steps" id="steps"></ol>
    </div>
  </aside>
</main>

<script>
var STAGES=["ID","Skills","Background","Admin approval"];
var DATA={
 roof:{t:"Roof",s:["Waterproofing","Roof repair","Gutter cleaning"],p:[["Karthik Raja","Waterproofing",4.9,212,4,"Replies in 10 min"],["Mani & Sons","Roofing",4.6,88,3,"Replies in 25 min"]]},
 bath:{t:"Bathroom",s:["Plumbing","Tiling","Leak repair"],p:[["Selvi Murugan","Plumber",4.8,301,4,"Replies in 8 min"],["Arun Tiles","Tiling",4.5,64,2,"Replies in 40 min"]]},
 living:{t:"Living room",s:["Electrician","AC service","Painting"],p:[["Naveen Kumar","Electrician",4.9,420,4,"Replies in 12 min"],["CoolBreeze AC","AC service",4.7,190,4,"Replies in 20 min"]]},
 kitchen:{t:"Kitchen",s:["Plumbing","Appliance repair","Chimney cleaning"],p:[["Priya Appliances","Appliance repair",4.8,276,4,"Replies in 15 min"],["Ravi Plumbing","Plumber",4.4,57,3,"Replies in 30 min"]]},
 garden:{t:"Garden & outside",s:["Pest control","Gardening","Pressure washing"],p:[["GreenLeaf Care","Gardening",4.7,143,4,"Replies in 18 min"],["SafeNest Pest","Pest control",4.6,201,3,"Replies in 22 min"]]}
};
var FLOW=["Requested","Accepted","On the way","In progress","Completed","Review"];
var timer=null;

function ring(n,name){
  var h='<svg class="ring" viewBox="0 0 52 52" role="img" aria-label="'+name+': '+n+' of 4 checks passed">';
  for(var i=0;i<4;i++){
    var a='cx="26" cy="26" r="21" pathLength="100" stroke-dasharray="21 79" stroke-dashoffset="'+(-i*25)+'"';
    h+='<circle class="off" '+a+'/>';
    if(i<n)h+='<circle class="seg" style="animation-delay:'+(i*90)+'ms" '+a+'/>';
  }
  var done=STAGES.slice(0,n).join(", ");
  return h+'<title>Verified: '+done+'</title></svg>';
}
function show(key){
  var d=DATA[key];
  document.querySelectorAll(".room").forEach(function(r){var on=r.dataset.room===key;r.classList.toggle("on",on);r.setAttribute("aria-pressed",on)});
  document.getElementById("title").textContent=d.t;
  document.getElementById("chips").innerHTML=d.s.map(function(s){return '<span class="chip">'+s+'</span>'}).join("");
  document.getElementById("pros").innerHTML=d.p.map(function(p,i){
    return '<div class="pro">'+ring(p[4],p[0])+'<div><b>'+p[0]+'</b><small>'+p[1]+' · ★ '+p[2]+' ('+p[3]+' jobs)</small><br><span class="tag">'+(p[4]===4?'Fully verified':p[4]+' of 4 checks')+'</span> <small>· '+p[5]+'</small></div><button class="book" data-i="'+i+'">Book</button></div>';
  }).join("");
  document.getElementById("track").hidden=true;clearInterval(timer);
  document.querySelectorAll(".book").forEach(function(b){b.onclick=function(){track(d.p[b.dataset.i][0])}});
}
function track(name){
  var box=document.getElementById("track"),ol=document.getElementById("steps"),i=0;
  box.hidden=false;clearInterval(timer);
  document.getElementById("trackTitle").textContent="Your booking with "+name;
  function draw(){
    ol.innerHTML=FLOW.map(function(s,k){
      var c=k<i?"done":k===i?"now":"";
      var t=k<=i?'<time>'+(10+k*7)+':'+(k*9<10?'0':'')+(k*9)+' am</time>':'';
      return '<li class="'+c+'"><span class="dot"></span>'+s+t+'</li>';
    }).join("");
  }
  draw();
  timer=setInterval(function(){ if(i<FLOW.length-1){i++;draw()}else clearInterval(timer)},1100);
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
document.querySelectorAll(".room").forEach(function(r){
  r.addEventListener("click",function(){show(r.dataset.room)});
  r.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();show(r.dataset.room)}});
});
document.getElementById("theme").onclick=function(){
  var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";this.textContent=dark?"Dark mode":"Light mode";
};
show("living");
</script>
</body>
</html>
